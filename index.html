
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REDZONE | Sports Center</title>
<style>
:root {
  --bg:#080b12;
  --panel:#111722;
  --panel2:#171f2d;
  --red:#ed2948;
  --text:#f4f6fa;
  --muted:#8994a6;
  --line:#222c3b;
  --green:#27d58a;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial, sans-serif;
}
button,input { font:inherit; }
button { cursor:pointer; }
.layout { display:flex; min-height:100vh; }
.sidebar {
  width:235px;
  background:#0d121c;
  border-right:1px solid var(--line);
  padding:26px 17px;
  position:fixed;
  inset:0 auto 0 0;
}
.logo {
  font-size:27px;
  font-weight:900;
  letter-spacing:2px;
  margin:4px 10px 38px;
}
.logo span { color:var(--red); }
.menu-label {
  color:var(--muted);
  font-size:11px;
  letter-spacing:1.5px;
  margin:25px 10px 12px;
}
.nav-btn {
  width:100%;
  border:0;
  color:#aeb8c8;
  background:transparent;
  text-align:left;
  padding:13px 12px;
  border-radius:9px;
  margin:3px 0;
  font-size:14px;
}
.nav-btn:hover,.nav-btn.active {
  background:#251722;
  color:white;
}
.nav-btn.active { border-left:3px solid var(--red); }
.main { margin-left:235px; width:calc(100% - 235px); }
.topbar {
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 35px;
  border-bottom:1px solid var(--line);
  background:#0b1019;
}
.topbar-title { font-weight:700; }
.topbar small { color:var(--muted); }
.status-pill {
  background:#17251f;
  color:var(--green);
  padding:9px 13px;
  border-radius:20px;
  font-size:12px;
}
.content { max-width:1400px; margin:auto; padding:30px 35px; }
.hero {
  background:linear-gradient(115deg,#28121e,#151a2a 65%,#101724);
  border:1px solid #392231;
  border-radius:16px;
  padding:30px;
  margin-bottom:28px;
}
.hero-tag { color:#ff7187; font-size:11px; letter-spacing:2px; font-weight:bold; }
.hero h1 { font-size:32px; margin:12px 0 8px; }
.hero p { color:#aeb8c8; margin:0; line-height:1.5; }
.section-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin:25px 0 17px;
}
.section-head h2 { font-size:19px; margin:0; }
.filters { display:flex; gap:8px; flex-wrap:wrap; }
.filter-btn {
  border:1px solid var(--line);
  color:#aeb8c8;
  background:var(--panel);
  padding:9px 14px;
  border-radius:8px;
  font-size:12px;
}
.filter-btn.active {
  background:var(--red);
  border-color:var(--red);
  color:white;
}
.toolbar {
  display:flex;
  gap:10px;
  margin:18px 0;
  flex-wrap:wrap;
}
.toolbar input,.toolbar select {
  background:var(--panel);
  border:1px solid var(--line);
  color:white;
  padding:12px;
  border-radius:8px;
  min-width:180px;
  outline:none;
}
.toolbar input { flex:1; }
.matches { display:grid; gap:12px; }
.match-card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:17px 20px;
  display:grid;
  grid-template-columns:1fr 130px 1fr;
  align-items:center;
  gap:12px;
  transition:.2s;
  cursor:pointer;
}
.match-card:hover {
  border-color:#754052;
  transform:translateY(-2px);
  background:var(--panel2);
}
.competition {
  grid-column:1/-1;
  color:var(--muted);
  font-size:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
}
.team {
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:700;
  font-size:14px;
}
.team.away { justify-content:flex-end; text-align:right; }
.team img { width:30px; height:30px; object-fit:contain; }
.score-area { text-align:center; }
.score { font-size:22px; font-weight:800; }
.match-time { color:var(--muted); font-size:11px; margin-top:5px; }
.match-status { font-size:11px; margin-top:6px; color:var(--green); }
.match-status.finished { color:var(--muted); }
.match-status.upcoming { color:#f2b95c; }
.empty {
  background:var(--panel);
  border:1px solid var(--line);
  padding:35px;
  text-align:center;
  border-radius:12px;
  color:var(--muted);
}
.footer {
  padding:30px 10px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}
.modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  background:#000b;
  padding:20px;
  overflow:auto;
}
.modal-box {
  max-width:600px;
  margin:7vh auto;
  background:var(--panel);
  border:1px solid #344052;
  border-radius:15px;
  padding:24px;
}
.modal-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
  padding-bottom:15px;
}
.modal-head h2 { font-size:16px; }
.close {
  border:0;
  background:transparent;
  color:white;
  font-size:27px;
}
.modal-teams {
  display:grid;
  grid-template-columns:1fr 90px 1fr;
  align-items:center;
  text-align:center;
  gap:8px;
  padding:30px 0;
}
.modal-team img { width:48px; height:48px; object-fit:contain; display:block; margin:0 auto 10px; }
.modal-score { font-size:25px; font-weight:900; }
.detail {
  background:var(--panel2);
  padding:15px;
  border-radius:9px;
  margin-top:12px;
  color:#b9c3d2;
  font-size:13px;
  line-height:1.7;
}
@media(max-width:800px) {
  .sidebar { width:65px; padding:20px 7px; }
  .logo { font-size:17px; margin:8px 2px 30px; letter-spacing:0; }
  .menu-label { display:none; }
  .nav-btn { text-align:center; font-size:11px; padding:13px 3px; }
  .nav-btn span { display:none; }
  .main { margin-left:65px; width:calc(100% - 65px); }
  .topbar { padding:0 15px; }
  .content { padding:20px 13px; }
  .hero { padding:22px; }
  .hero h1 { font-size:25px; }
  .match-card { grid-template-columns:1fr 75px 1fr; padding:14px 10px; }
  .team { font-size:12px; gap:5px; }
  .team img { width:23px; height:23px; }
  .score { font-size:18px; }
}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="logo">RED<span>ZONE</span></div>
    <div class="menu-label">MENU KRYESORE</div>
    <button class="nav-btn active" onclick="selectSport('football',this)">⚽ <span>Futboll</span></button>
    <button class="nav-btn" onclick="selectSport('basketball',this)">🏀 <span>Basketboll</span></button>
    <button class="nav-btn" onclick="selectSport('tennis',this)">🎾 <span>Tenis</span></button>
    <div class="menu-label">PLATFORMA</div>
    <button class="nav-btn" onclick="showInfo('Qendra e ndeshjeve')">▣ <span>Ndeshjet</span></button>
    <button class="nav-btn" onclick="showInfo('Statistikat do të shtohen në fazën tjetër.')">▤ <span>Statistika</span></button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">Sports Center <small> / REDZONE</small></div>
      <div class="status-pill">● PLATFORMË DEMO</div>
    </header>

    <div class="content">
      <section class="hero">
        <div class="hero-tag">WELCOME TO REDZONE</div>
        <h1>Çdo ndeshje. Një destinacion.</h1>
        <p>Qendra jote sportive për ndeshje, rezultate dhe informacion.</p>
      </section>

      <div class="section-head">
        <h2 id="sportTitle">⚽ Futboll</h2>
        <div class="filters">
          <button class="filter-btn active" onclick="setFilter('all',this)">Të gjitha</button>
          <button class="filter-btn" onclick="setFilter('live',this)">Live</button>
          <button class="filter-btn" onclick="setFilter('upcoming',this)">Sot</button>
          <button class="filter-btn" onclick="setFilter('finished',this)">Përfunduara</button>
        </div>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Kërko ekipin ose kampionatin..." oninput="renderMatches()">
        <select id="league" onchange="renderMatches()">
          <option value="all">Të gjitha kampionatet</option>
        </select>
      </div>

      <div id="matches" class="matches"></div>
      <div class="footer">REDZONE © 2026 · Sports Information Platform</div>
    </div>
  </main>
</div>

<div class="modal" id="matchModal" onclick="outsideClose(event)">
  <div class="modal-box">
    <div class="modal-head">
      <h2>REDZONE MATCH CENTER</h2>
      <button class="close" onclick="closeMatchDetails()">×</button>
    </div>
    <div id="matchDetailsContent"></div>
  </div>
</div>

<script>
const demoMatches = {
  football: [
    {home:"Real Madrid",away:"Barcelona",competition:"La Liga",time:"21:00",status:"upcoming",home_score:null,away_score:null},
    {home:"Manchester City",away:"Arsenal",competition:"Premier League",time:"18:30",status:"live",home_score:1,away_score:1},
    {home:"Inter",away:"AC Milan",competition:"Serie A",time:"20:45",status:"finished",home_score:2,away_score:1},
    {home:"Bayern Munich",away:"Borussia Dortmund",competition:"Bundesliga",time:"17:30",status:"upcoming",home_score:null,away_score:null}
  ],
  basketball: [
    {home:"LA Lakers",away:"Boston Celtics",competition:"NBA",time:"20:00",status:"upcoming",home_score:null,away_score:null},
    {home:"Chicago Bulls",away:"Miami Heat",competition:"NBA",time:"19:30",status:"live",home_score:55,away_score:49}
  ],
  tennis: [
    {home:"Player A",away:"Player B",competition:"ATP Tour",time:"16:00",status:"live",home_score:1,away_score:0},
    {home:"Player C",away:"Player D",competition:"WTA Tour",time:"18:00",status:"upcoming",home_score:null,away_score:null}
  ]
};

let currentSport = "football";
let currentFilter = "all";
let allMatches = demoMatches.football;

function selectSport(sport,button) {
  currentSport = sport;
  allMatches = demoMatches[sport];
  currentFilter = "all";
  document.querySelectorAll(".sidebar .nav-btn").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  document.getElementById("sportTitle").textContent =
    sport==="football" ? "⚽ Futboll" :
    sport==="basketball" ? "🏀 Basketboll" : "🎾 Tenis";
  document.querySelectorAll(".filter-btn").forEach((b,i)=>b.classList.toggle("active",i===0));
  document.getElementById("search").value = "";
  renderMatches();
}

function setFilter(filter,button) {
  currentFilter = filter;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  renderMatches();
}

function renderMatches() {
  const container = document.getElementById("matches");
  const search = document.getElementById("search").value.toLowerCase().trim();
  const leagueSelect = document.getElementById("league");
  const oldLeague = leagueSelect.value;

  const leagues = [...new Set(allMatches.map(m=>m.competition))];
  leagueSelect.innerHTML = '<option value="all">Të gjitha kampionatet</option>';
  leagues.forEach(name=>{
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    leagueSelect.appendChild(option);
  });
  leagueSelect.value = leagues.includes(oldLeague) ? oldLeague : "all";

  let filtered = allMatches.filter(match=>{
    const matchesFilter = currentFilter==="all" || match.status===currentFilter;
    const matchesLeague = leagueSelect.value==="all" || match.competition===leagueSelect.value;
    const matchesSearch = (match.home+" "+match.away+" "+match.competition).toLowerCase().includes(search);
    return matchesFilter && matchesLeague && matchesSearch;
  });

  container.replaceChildren();

  if(filtered.length===0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Nuk u gjet asnjë ndeshje.";
    container.appendChild(empty);
    return;
  }

  filtered.forEach(match=>{
    const card = document.createElement("article");
    card.className = "match-card";

    const competition = document.createElement("div");
    competition.className = "competition";
    competition.textContent = match.competition;

    const home = document.createElement("div");
    home.className = "team";
    home.textContent = match.home;

    const away = document.createElement("div");
    away.className = "team away";
    away.textContent = match.away;

    const scoreArea = document.createElement("div");
    scoreArea.className = "score-area";

    const score = document.createElement("div");
    score.className = "score";
    score.textContent = match.status==="upcoming" ? "VS" : `${match.home_score} - ${match.away_score}`;

    const time = document.createElement("div");
    time.className = "match-time";
    time.textContent = match.time;

    const status = document.createElement("div");
    status.className = "match-status "+match.status;
    status.textContent = match.status==="live" ? "● LIVE" :
      match.status==="finished" ? "PËRFUNDUAR" : "SË SHPEJTI";

    scoreArea.append(score,time,status);
    card.append(competition,home,scoreArea,away);
    card.addEventListener("click",()=>openMatchDetails(match));
    container.appendChild(card);
  });
}

function openMatchDetails(match) {
  const content = document.getElementById("matchDetailsContent");
  content.replaceChildren();

  const teams = document.createElement("div");
  teams.className = "modal-teams";

  const home = document.createElement("div");
  home.className = "modal-team";
  home.textContent = match.home;

  const score = document.createElement("div");
  score.className = "modal-score";
  score.textContent = match.status==="upcoming" ? "VS" : `${match.home_score} - ${match.away_score}`;

  const away = document.createElement("div");
  away.className = "modal-team";
  away.textContent = match.away;

  teams.append(home,score,away);

  const details = document.createElement("div");
  details.className = "detail";
  details.textContent = "Kampionati: "+match.competition+" | Ora: "+match.time;

  const note = document.createElement("div");
  note.className = "detail";
  note.textContent = "Këto janë të dhëna demonstrimi. Lidhja me rezultatet reale dhe statistikat do të konfigurohet veçmas.";

  content.append(teams,details,note);
  document.getElementById("matchModal").style.display = "block";
}

function closeMatchDetails() {
  document.getElementById("matchModal").style.display = "none";
}

function outsideClose(event) {
  if(event.target.id==="matchModal") closeMatchDetails();
}

function showInfo(message) {
  alert(message);
}

renderMatches();
</script>
</body>
</html>
